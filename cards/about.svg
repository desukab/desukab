<svg width="800" height="700" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">About Bharath</title>
<desc id="desc">A matcha Material 3 Expressive surface with Bharath's profile and values.</desc>
<defs><clipPath id="card"><rect width="800" height="700" rx="48"/></clipPath></defs>
<rect width="800" height="700" rx="48" fill="#ffffff"/>
<g clip-path="url(#card)">
  <text x="60" y="56" font-family="Karla,Georgia,serif" font-weight="800" font-size="24" fill="#13160f">About Bharath</text>
  <text x="60" y="92" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#5c6150">I like taking a problem apart, understanding how the pieces fit together, and building a practical solution. My work spans AI-assisted software engineering, video tooling, mobile apps, and systems programming.</text>
  <text x="60" y="126" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#5c6150">I'm especially interested in how agent harnesses and coding agents can make software development more organised: clear specifications, small tasks, repeatable tests, honest progress checks, and working releases instead of impressive-looking demos.</text>
  <text x="60" y="160" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#5c6150">Building in public where I can, learning from every failure, and documenting what it takes to turn a rough idea into something people can actually use.</text>
  <rect x="60" y="188" width="1" height="340" fill="#d9d6c4"/>
  <text x="84" y="216" font-family="DM Mono,monospace" font-size="13" fill="#7e9765">Curiosity</text>
  <text x="84" y="216" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#5c6150" x="150">over assumptions</text>
  <text x="84" y="244" font-family="DM Mono,monospace" font-size="13" fill="#7e9765">Discipline</text>
  <text x="84" y="244" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#5c6150" x="150">over motivation</text>
  <text x="84" y="272" font-family="DM Mono,monospace" font-size="13" fill="#7e9765">Creativity</text>
  <text x="84" y="272" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#5c6150" x="150">over convention</text>
  <text x="84" y="300" font-family="DM Mono,monospace" font-size="13" fill="#7e9765">Consistency</text>
  <text x="84" y="300" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#5c6150" x="150">over intensity</text>
  <text x="84" y="328" font-family="DM Mono,monospace" font-size="13" fill="#7e9765">Evidence</text>
  <text x="84" y="328" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#5c6150" x="150">over hype</text>
</g>
</svg>
